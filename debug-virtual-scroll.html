<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>虚拟滚动偏移调试</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 20px;
				background: #f5f5f5;
			}

			.container {
				width: 600px;
				height: 400px;
				border: 2px solid #333;
				position: relative;
				overflow: auto;
				background: white;
			}

			.virtual-phantom {
				position: absolute;
				left: 0;
				top: 0;
				width: 2000px;
				height: 2000px;
				background: linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
					linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
					linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
					linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
				background-size: 20px 20px;
				z-index: -1;
			}

			.virtual-content {
				position: absolute;
				left: 0;
				top: 0;
				z-index: 2;
				transition: transform 0.1s ease;
			}

			.cell {
				position: absolute;
				width: 100px;
				height: 25px;
				border: 1px solid #ddd;
				background: #fff;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 12px;
			}

			.selection-box {
				position: absolute;
				border: 2px solid #007acc;
				background: rgba(0, 122, 204, 0.1);
				pointer-events: none;
				z-index: 10;
			}

			.debug-info {
				position: fixed;
				top: 10px;
				right: 10px;
				background: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 10px;
				border-radius: 5px;
				font-family: monospace;
				font-size: 12px;
				max-width: 300px;
			}

			.controls {
				margin-bottom: 20px;
			}

			button {
				margin: 5px;
				padding: 8px 16px;
				background: #007acc;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
			}

			button:hover {
				background: #005a9e;
			}
		</style>
	</head>
	<body>
		<h1>虚拟滚动偏移调试工具</h1>

		<div class="controls">
			<button onclick="selectCell(5, 3)">选择单元格 R5C3</button>
			<button onclick="selectCell(10, 8)">选择单元格 R10C8</button>
			<button onclick="selectCell(20, 15)">选择单元格 R20C15</button>
			<button onclick="scrollToPosition(500, 300)">滚动到 (500, 300)</button>
			<button onclick="scrollToPosition(1000, 800)">滚动到 (1000, 800)</button>
			<button onclick="resetScroll()">重置滚动</button>
		</div>

		<div class="container" id="container">
			<div class="virtual-phantom"></div>
			<div class="virtual-content" id="virtualContent">
				<!-- 动态生成单元格 -->
			</div>
			<div class="selection-box" id="selectionBox" style="display: none"></div>
		</div>

		<div class="debug-info" id="debugInfo">调试信息将显示在这里...</div>

		<script>
			const container = document.getElementById('container')
			const virtualContent = document.getElementById('virtualContent')
			const selectionBox = document.getElementById('selectionBox')
			const debugInfo = document.getElementById('debugInfo')

			const CELL_WIDTH = 100
			const CELL_HEIGHT = 25
			const ROWS = 80
			const COLS = 20

			let currentSelection = null
			let virtualOffset = {top: 0, left: 0}

			// 生成虚拟单元格
			function generateCells() {
				virtualContent.innerHTML = ''

				// 只生成可视区域附近的单元格
				const scrollTop = container.scrollTop
				const scrollLeft = container.scrollLeft
				const containerHeight = container.clientHeight
				const containerWidth = container.clientWidth

				const startRow = Math.max(0, Math.floor(scrollTop / CELL_HEIGHT) - 5)
				const endRow = Math.min(
					ROWS,
					Math.ceil((scrollTop + containerHeight) / CELL_HEIGHT) + 5
				)
				const startCol = Math.max(0, Math.floor(scrollLeft / CELL_WIDTH) - 5)
				const endCol = Math.min(
					COLS,
					Math.ceil((scrollLeft + containerWidth) / CELL_WIDTH) + 5
				)

				for (let r = startRow; r < endRow; r++) {
					for (let c = startCol; c < endCol; c++) {
						const cell = document.createElement('div')
						cell.className = 'cell'
						cell.style.top = `${r * CELL_HEIGHT}px`
						cell.style.left = `${c * CELL_WIDTH}px`
						cell.textContent = `R${r}C${c}`
						cell.onclick = () => selectCell(r, c)
						virtualContent.appendChild(cell)
					}
				}
			}

			// 更新虚拟偏移
			function updateVirtualOffset() {
				const scrollTop = container.scrollTop
				const scrollLeft = container.scrollLeft

				// 计算虚拟偏移（模拟真实的虚拟滚动逻辑）
				const startRow = Math.floor(scrollTop / CELL_HEIGHT)
				const startCol = Math.floor(scrollLeft / CELL_WIDTH)

				virtualOffset.top = startRow * CELL_HEIGHT
				virtualOffset.left = startCol * CELL_WIDTH

				// 应用 transform
				virtualContent.style.transform = `translate(${virtualOffset.left}px, ${virtualOffset.top}px)`

				updateDebugInfo()
			}

			// 选择单元格
			function selectCell(row, col) {
				currentSelection = {row, col}
				updateSelectionBox()
			}

			// 更新选区框位置
			function updateSelectionBox() {
				if (!currentSelection) return

				const {row, col} = currentSelection

				// 计算基础位置
				const baseTop = row * CELL_HEIGHT
				const baseLeft = col * CELL_WIDTH

				// 方法1：加上虚拟偏移（原来的方法）
				const method1Top = baseTop + virtualOffset.top
				const method1Left = baseLeft + virtualOffset.left

				// 方法2：减去虚拟偏移（修正方法）
				const method2Top = baseTop - virtualOffset.top
				const method2Left = baseLeft - virtualOffset.left

				// 方法3：综合考虑滚动位置和可视区域
				const scrollTop = container.scrollTop
				const scrollLeft = container.scrollLeft
				const method3Top = baseTop - virtualOffset.top + scrollTop
				const method3Left = baseLeft - virtualOffset.left + scrollLeft

				// 当前使用方法3（综合版）
				selectionBox.style.top = `${method3Top}px`
				selectionBox.style.left = `${method3Left}px`
				selectionBox.style.width = `${CELL_WIDTH}px`
				selectionBox.style.height = `${CELL_HEIGHT}px`
				selectionBox.style.display = 'block'

				updateDebugInfo()
			}

			// 更新调试信息
			function updateDebugInfo() {
				const scrollTop = container.scrollTop
				const scrollLeft = container.scrollLeft

				let info = `滚动位置: (${scrollLeft}, ${scrollTop})\n`
				info += `虚拟偏移: (${virtualOffset.left}, ${virtualOffset.top})\n`
				info += `Transform: translate(${virtualOffset.left}px, ${virtualOffset.top}px)\n\n`

				if (currentSelection) {
					const {row, col} = currentSelection
					const baseTop = row * CELL_HEIGHT
					const baseLeft = col * CELL_WIDTH

					info += `选中单元格: R${row}C${col}\n`
					info += `基础位置: (${baseLeft}, ${baseTop})\n`
					info += `方法1 (加偏移): (${baseLeft + virtualOffset.left}, ${
						baseTop + virtualOffset.top
					})\n`
					info += `方法2 (减偏移): (${baseLeft - virtualOffset.left}, ${
						baseTop - virtualOffset.top
					})\n`
					const scrollTop = container.scrollTop
					const scrollLeft = container.scrollLeft
					info += `方法3 (综合): (${baseLeft - virtualOffset.left + scrollLeft}, ${
						baseTop - virtualOffset.top + scrollTop
					})\n`
					info += `当前使用: 方法3 (综合考虑滚动位置和可视区域)\n`
				}

				debugInfo.textContent = info
			}

			// 滚动到指定位置
			function scrollToPosition(left, top) {
				container.scrollLeft = left
				container.scrollTop = top
			}

			// 重置滚动
			function resetScroll() {
				container.scrollLeft = 0
				container.scrollTop = 0
			}

			// 滚动事件处理
			container.addEventListener('scroll', () => {
				updateVirtualOffset()
				generateCells()
				updateSelectionBox()
			})

			// 初始化
			generateCells()
			updateVirtualOffset()
			selectCell(5, 3) // 默认选择一个单元格
		</script>
	</body>
</html>
